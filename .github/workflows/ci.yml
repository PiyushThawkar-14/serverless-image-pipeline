name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test Lambda handlers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Must match the nodejs22.x runtime the Lambdas are deployed on.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check handlers parse
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  shellcheck:
    name: Lint deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck
        # The deploy scripts are the only "infrastructure" in this repo, so they
        # get linted as seriously as the application code does.
        # TODO: tighten to --severity=warning once the existing SC2034 (unused
        # colour variables) findings are cleaned up, so the gate only ever ratchets up.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/*.sh
